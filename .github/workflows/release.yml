name: release

# CADENCE, not release-on-merge. hive-spi carries fan-in 14; its cost to the
# fleet is fan-in x releases, and publishing on every src push made the second
# factor the dominant one (10 releases in 90 days). Merges now accumulate; a
# release is an act someone takes, on the schedule ./freeze-policy.edn declares.
# The quarterly cron is the floor, not a promise — freeze-check still refuses a
# run that lands inside the window without a declared exception.
on:
  schedule:
    # 04:00 UTC on the first day of Jan / Apr / Jul / Oct.
    - cron: '0 4 1 1,4,7,10 *'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest

      # The freeze gate. Runs BEFORE bump, because a published pom is
      # immutable: refusing here costs a red run, refusing after deploy is
      # impossible. Reads ./freeze-policy.edn.
      - name: Freeze check
        run: clojure -T:build freeze-check

      - name: Bump patch version
        run: clojure -T:build bump :level :patch

      - name: Commit and tag
        run: |
          VER=$(cat VERSION)
          git config user.name  "hive-ci"
          git config user.email "ci@hive-agi.local"
          git add VERSION
          # [skip ci] stops this push from retriggering the workflow.
          git commit -m "chore(release): $VER [skip ci]"
          # Annotated: `git push --follow-tags` ignores lightweight tags,
          # which would publish the artifact and silently drop the tag.
          git tag -a "v$VER" -m "release $VER"
          git push --follow-tags

      - name: Deploy
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_DEPLOY_TOKEN }}
        run: clojure -T:build deploy
